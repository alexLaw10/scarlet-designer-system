name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: there's a known backlog of pre-existing lint/
      # format issues across the codebase (never enforced before), tracked
      # separately. Flip continue-on-error off once that's cleared, so new
      # violations start failing the build again.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test.spec -- --ci --coverage

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
